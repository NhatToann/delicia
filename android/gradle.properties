# The build machine has 8 GB of RAM, so the Flutter template default
# (-Xmx8G for Gradle plus a separate Kotlin daemon) does not fit: the
# Kotlin daemon gets OOM-killed and the build fails with
# "Could not close incremental caches".
#
# 2 GB for the Gradle JVM plus the Kotlin compiler running inside that
# same JVM is enough for this app and leaves room for the OS.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m
org.gradle.daemon=true
org.gradle.parallel=false
org.gradle.workers.max=1
# Compile Kotlin inside the Gradle JVM instead of spawning a second
# (memory hungry) Kotlin daemon.
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
