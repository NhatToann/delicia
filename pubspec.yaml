name: delicia
description: "Delicia - Food Delivery App (Leader: UC-02/03/04/12)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  bloc: ^8.1.4
  flutter_bloc: ^8.1.6

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  firebase_database: ^11.1.2
  firebase_storage: ^12.3.4
  image_picker: 1.1.2
  # Match Flutter 3.47's Android compile SDK and plugin requirements.
  image_picker_android: 0.8.13+25
  # firebase_messaging + flutter_local_notifications are intentionally deferred
  # to UC-12 (Push notifications) so the auth-flow build stays clean.

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2

  # Routing
  go_router: ^14.6.2

  # Form
  form_field_validator: ^1.1.0

  # Networking
  http: ^1.2.2

  # UI
  google_fonts: ^4.0.4
  flutter_svg: ^2.0.5
  font_awesome_flutter: ^10.4.0
  shimmer: ^2.0.0
  intl: ^0.20.3
  cached_network_image: ^3.4.1
  # Disk-backed tiles for flutter_map 7.x (persistent cache is built in from
  # flutter_map 8.2, but upgrading is incompatible with our animation pin).
  flutter_cache_manager: ^3.4.5

  # Localisation (Vietnamese is the product language).
  # Ships Material/Cupertino/Widgets delegates so the built-in widgets
  # (date pickers, text selection menus, ...) speak the active locale.
  flutter_localizations:
    sdk: flutter

  # Maps + Realtime
  # Using flutter_map + OpenStreetMap (free, no API key, no billing)
  # instead of google_maps_flutter. Tile URL is configurable in
  # lib/data/env/environment.dart via [Environment.tileServerUrl].
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^12.0.0
  geocoding: ^5.0.0
  permission_handler: ^11.3.1
  url_launcher: ^6.3.1

  # Smooth camera moves + animated markers (grab-style tracking map).
  # Pinned to 0.8.x because 0.9+ requires flutter_map >=8.0.0 while we
  # stay on 7.x. The Grab-style bottom sheet uses Flutter's built-in
  # DraggableScrollableSheet instead of sliding_up_panel, which is stuck
  # on a Dart 2 SDK constraint (<3.0.0).
  flutter_map_animations: ^0.8.0
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: ^9.1.7
  mocktail: ^1.0.4
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Enables `flutter gen-l10n`, which turns lib/l10n/app_vi.arb into the
  # AppLocalizations class under lib/l10n/generated/.
  generate: true

  # League Spartan is the single family declared on Figma node 47:23.
  # Shipped as a variable font so every weight comes from one 93 KB file and
  # the app never needs a network fetch for type.
  fonts:
    - family: LeagueSpartan
      fonts:
        - asset: assets/fonts/LeagueSpartan.ttf

  assets:
    - assets/logos/
    - assets/icons/
    - assets/categories/
    - assets/products/
    - assets/map/
    - assets/figma_home/
    - assets/figma_cart/
    - assets/figma_payment/
    - assets/figma_product/
    - assets/vietnam_places.json
    - assets/vietnam_wards.json
