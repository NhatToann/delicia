name: delicia
description: "Delicia - Food Delivery App (Leader: UC-02/03/04/12)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  bloc: ^8.1.4
  flutter_bloc: ^8.1.6

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  firebase_database: ^11.1.2
  firebase_storage: ^12.3.4
  # firebase_messaging + flutter_local_notifications are intentionally deferred
  # to UC-12 (Push notifications) so the auth-flow build stays clean.

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2

  # Routing
  go_router: ^14.6.2

  # Form
  form_field_validator: ^1.1.0

  # UI
  google_fonts: ^4.0.4
  flutter_svg: ^2.0.5
  font_awesome_flutter: ^10.4.0
  shimmer: ^2.0.0
  intl: ^0.18.1
  cached_network_image: ^3.4.1

  # Maps + Realtime
  # Using flutter_map + OpenStreetMap (free, no API key, no billing)
  # instead of google_maps_flutter. Tile URL is configurable in
  # lib/data/env/environment.dart via [Environment.tileServerUrl].
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^12.0.0
  geocoding: ^5.0.0
  permission_handler: ^11.3.1
  url_launcher: ^6.3.1

  # Avatar picker used by the UC-06 profile screen. Added by Member A
  # because the spec requires "avatar selection and upload using Firebase
  # Storage" — we keep the rest of the dependency footprint unchanged.
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: ^9.1.7
  mocktail: ^1.0.4
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/logos/
    - assets/icons/
    - assets/categories/
    - assets/products/
    - assets/map/