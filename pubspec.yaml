name: delicia
description: "Delicia - Food Delivery App (P0 Auth Flow)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  bloc: ^8.1.4
  flutter_bloc: ^8.1.6

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  firebase_database: ^11.1.2
  # firebase_messaging + flutter_local_notifications are intentionally deferred
  # to UC-12 (Push notifications) so the auth-flow build stays clean.

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2

  # Routing
  go_router: ^14.6.2

  # Form
  form_field_validator: ^1.1.0

  # UI
  google_fonts: ^4.0.4
  flutter_svg: ^2.0.5
  font_awesome_flutter: ^10.4.0
  shimmer: ^2.0.0
  intl: ^0.18.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: ^9.1.7
  mocktail: ^1.0.4
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
